<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARK OS</title>
    <style>
        :root {
            --iron-blue: #00f3ff;
            --iron-glow: rgba(0, 243, 255, 0.4);
            --iron-dark: #00a5cc;
            --neon-pink: #ff006e;
            --neon-purple: #bd00ff;
            --arc-gold: #ffaa00;
            --core-speed: 12s;
            --orbit-speed: 14s;
            --pulse-speed: 4s;
        }

        * {
            box-sizing: border-box;
        }

        body {
            /* Amélioration du dégradé de fond pour un effet de profondeur holographique */
            background: radial-gradient(circle at 50% 50%, #0d1124 0%, #05060f 60%, #020205 100%);
            background-attachment: fixed;
            color: var(--iron-blue);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
            justify-content: space-between;
            position: relative;
        }

        /* SUPER BACKGROUND HUD TECHNIQUE */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Grille high-tech + Cercles de visée radar en arrière-plan + Particules holographiques */
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 243, 255, 0.02) 25%, rgba(0, 243, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(0, 243, 255, 0.02) 75%, rgba(0, 243, 255, 0.02) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 243, 255, 0.02) 25%, rgba(0, 243, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(0, 243, 255, 0.02) 75%, rgba(0, 243, 255, 0.02) 76%, transparent 77%, transparent),
                radial-gradient(circle at 50% 50%, transparent 20%, rgba(0, 243, 255, 0.015) 21%, rgba(0, 243, 255, 0.015) 23%, transparent 24%, transparent 40%, rgba(0, 243, 255, 0.01) 41%, rgba(0, 243, 255, 0.01) 42%, transparent 43%),
                radial-gradient(rgba(0, 243, 255, 0.2) 1px, transparent 0);
            background-size: 60px 60px, 60px 60px, 100% 100%, 40px 40px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.85;
        }

        /* Effet de vignetage et lignes de scan horizontales discrètes style écran CRT */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 120%);
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
            z-index: 3;
            opacity: 0.4;
        }

        body > * {
            position: relative;
            z-index: 2;
        }

        /* Barre supérieure HUD */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid rgba(0, 243, 255, 0.15);
            border-image: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent) 1;
            padding: 10px 0;
            width: 100%;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .os-title {
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        #status {
            color: var(--arc-gold);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse-status 2s infinite;
        }

        @keyframes pulse-status {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Bloc Horloge (Haut Droite) */
        .hud-right-clock {
            text-align: right;
            position: relative;
            padding-right: 5px;
            user-select: none;
        }

        .bg-text {
            font-family: 'Arial Black', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            position: absolute;
            top: -12px;
            right: 10px;
            z-index: -1;
        }

        .big-time {
            font-family: 'Arial', sans-serif;
            font-size: 40px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
            letter-spacing: -1px;
            margin: 0;
        }

        .big-date {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(0, 243, 255, 0.8);
            text-transform: uppercase;
            margin-top: 5px;
            display: block;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }

        /* Zone centrale du Cœur Holographique */
        .center-zone {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            min-height: 380px;
        }

        .stage-3d {
            perspective: 1000px;
            width: min(65vw, 440px);
            height: min(65vw, 440px);
            min-width: 280px;
            min-height: 280px;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Aura lumineuse globale derrière le cœur */
        .stage-3d::before {
            content: '';
            position: absolute;
            width: 110%;
            height: 110%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 243, 255, 0.25) 0%, rgba(189, 0, 255, 0.08) 45%, transparent 70%);
            border-radius: 50%;
            animation: pulse-aura var(--pulse-speed) ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-aura {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.9; }
        }

        /* Éléments d'interface (Reticules et Disques) */
        .hud-reticle, .scan-disc, .orbit-field, .sphere-3d, .core-interface {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .hud-reticle {
            border: 1px dashed rgba(0, 243, 255, 0.25);
            border-radius: 50%;
            box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.05);
            animation: counter-rotate 30s linear infinite;
        }

        /* Cercles concentriques de scan */
        .scan-disc {
            inset: 8%;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0 10px, rgba(0, 243, 255, 0.04) 11px 12px);
            transform: rotateX(75deg) translateZ(-30px);
            opacity: 0.7;
        }

        /* Sphère technologique composée d'anneaux rotatifs */
        .sphere-3d {
            animation: rotate3D var(--core-speed) linear infinite;
        }

        .ring {
            position: absolute;
            inset: 5%;
            border: 2px solid rgba(0, 243, 255, 0.45);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* Orientation en 3D pour former la structure de la sphère */
        .ring:nth-child(1) { transform: rotateY(0deg); }
        .ring:nth-child(2) { transform: rotateY(30deg); border-color: rgba(0, 243, 255, 0.35); }
        .ring:nth-child(3) { transform: rotateY(60deg); border-color: rgba(0, 243, 255, 0.25); }
        .ring:nth-child(4) { transform: rotateY(90deg); border-color: rgba(0, 243, 255, 0.35); }
        .ring:nth-child(5) { transform: rotateY(120deg); border-color: rgba(0, 243, 255, 0.25); }
        .ring:nth-child(6) { transform: rotateY(150deg); border-color: rgba(0, 243, 255, 0.35); }
        .ring:nth-child(7) { transform: rotateX(90deg); border-color: rgba(255, 170, 0, 0.4); box-shadow: 0 0 20px rgba(255, 170, 0, 0.2); }

        /* Noyau central (Réacteur de filtrage) */
        .core-interface {
            inset: 22%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 4, 16, 0.95) 50%, rgba(0, 165, 204, 0.2) 100%);
            border: 3px solid rgba(0, 243, 255, 0.8);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.6), inset 0 0 25px rgba(0, 243, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(10px);
            animation: core-breathe var(--pulse-speed) ease-in-out infinite;
        }

        /* INSCRIPTION "STARK" UNIQUE AU CENTRE */
        .stark-brand {
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: min(4.5vw, 26px);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px #ffffff, 
                0 0 20px var(--iron-blue), 
                0 0 40px var(--iron-blue);
            transform: translateZ(25px);
            z-index: 10;
            user-select: none;
        }

        /* Couronnes de détails pour le style mécanique */
        .core-interface::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 2px dashed rgba(255, 170, 0, 0.6);
            border-radius: 50%;
            animation: rotate3D 8s linear infinite;
        }

        /* Étoiles/Nodes de données orbitales */
        .orbit-field {
            animation: orbit-spin var(--orbit-speed) linear infinite;
        }

        .orbit-line {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px dashed rgba(189, 0, 255, 0.25);
            transform: rotateX(60deg) rotateY(15deg);
        }

        .orbit-line::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            top: 0;
            left: 50%;
            box-shadow: 0 0 12px #ffffff, 0 0 20px var(--iron-blue);
        }

        /* Animations fondamentales */
        @keyframes rotate3D {
            0% { transform: rotateX(60deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(60deg) rotateY(360deg) rotateZ(360deg); }
        }

        @keyframes counter-rotate {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes orbit-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes core-breathe {
            0%, 100% { transform: translateZ(10px) scale(0.97); }
            50% { transform: translateZ(20px) scale(1.03); border-color: #ffffff; box-shadow: 0 0 45px rgba(0, 243, 255, 0.8), inset 0 0 30px rgba(0, 243, 255, 0.5); }
        }

        /* Modes dynamiques gérés par l'IA */
        body.is-listening { --core-speed: 5s; --pulse-speed: 2s; }
        body.is-processing { --core-speed: 1s; --pulse-speed: 0.8s; }
        body.is-processing .core-interface { border-color: var(--neon-purple); box-shadow: 0 0 40px var(--neon-purple); }
        body.is-speaking { --pulse-speed: 1.5s; }
        body.is-speaking .core-interface { box-shadow: 0 0 50px #ffffff, 0 0 30px var(--iron-blue); }

        /* Pied de page HUD */
        .hud-footer {
            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.5;
            border-top: 2px solid rgba(0, 243, 255, 0.15);
            border-image: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent) 1;
            padding-top: 15px;
            text-transform: uppercase;
            color: var(--iron-dark);
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <div class="hud-left">
            <div class="os-title">STARK OS v4.5</div>
            <div id="status">TAP TO CONNECT TO ARC CORE</div>
        </div>
        
        <div class="hud-right-clock">
            <span class="bg-text">STARK</span>
            <h1 class="big-time" id="main-clock">00:00</h1>
            <span class="big-date" id="main-date">CHARGEMENT...</span>
        </div>
    </div>

    <div class="center-zone" onclick="initStarkOS()">
        <div class="stage-3d">
            <div class="hud-reticle"></div>
            <div class="scan-disc"></div>
            
            <div class="sphere-3d" id="core-3d">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>

            <div class="orbit-field">
                <div class="orbit-line"></div>
            </div>

            <div class="core-interface">
                <div class="stark-brand">STARK</div>
            </div>
        </div>
    </div>

    <div class="hud-footer">
        SECURE VOICE ASSISTANT INTERFACE
    </div>

    <script>
        const GROQ_API_KEY = "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";

        const mainClock = document.getElementById('main-clock');
        const mainDate = document.getElementById('main-date');
        const statusDiv = document.getElementById('status');
        const core3D = document.getElementById('core-3d');
        let active = false;

        function setVisualMode(mode) {
            document.body.classList.remove('is-listening', 'is-processing', 'is-speaking');
            if (mode) document.body.classList.add(mode);
        }

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            mainClock.innerText = `${hours}:${minutes}`;

            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            let dateStr = now.toLocaleDateString('fr-FR', options);
            mainDate.innerText = dateStr.toUpperCase();
        }
        setInterval(updateTime, 1000);
        updateTime();

        const synth = window.speechSynthesis;
        let recognition;
        let isSpeaking = false;

        function speak(text) {
            isSpeaking = true;
            setVisualMode('is-speaking');
            if (recognition) recognition.stop();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.pitch = 0.85; 
            utterance.rate = 1.05;
            
            utterance.onend = () => {
                isSpeaking = false;
                setVisualMode(active ? 'is-listening' : '');
                if (active) recognition.start();
            };
            synth.speak(utterance);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            
            recognition.onstart = () => {
                if(!isSpeaking) {
                    statusDiv.innerText = "CORE_LINK: LISTENING...";
                    statusDiv.style.color = "#00f3ff";
                    setVisualMode('is-listening');
                }
            };

            recognition.onend = () => {
                if (active && !isSpeaking) recognition.start();
            };

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript;
                if (command.trim()) {
                    askStarkOS(command);
                }
            };
        }

        function initStarkOS() {
            if(!active && SpeechRecognition) {
                active = true;
                recognition.start();
                speak("Bonjour, Je M'appelle STARK Une IA crée par Bastien Bodo, pres a vous ecouté.");
            }
        }

        async function askStarkOS(question) {
            setVisualMode('is-processing');
            statusDiv.innerText = "PROCESSING MATRIX...";
            statusDiv.style.color = "#bd00ff";
            
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "Tu es STARK OS, l'intelligence artificielle centrale créée par Bastien Bodo. Réponds de façon concise, futuriste, intelligente et appelle l'utilisateur Monsieur." },
                            { role: "user", content: question }
                        ],
                    })
                });

                if (!response.ok) throw new Error();
                const data = await response.json();
                const reply = data.choices[0].message.content;
                speak(reply);
            } catch (e) {
                setVisualMode('is-speaking');
                speak("Erreur de transfert réseau, Monsieur.");
            }
        }
    </script>
</body>
</html>
